<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的纯网页</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 导航栏 */
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 1.5rem;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #1abc9c;
        }

        /* 主体内容区 */
        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            margin-bottom: 1rem;
            color: #2c3e50;
        }

        p {
            margin-bottom: 1.5rem;
        }

        /* 按钮样式 */
        .btn {
            display: inline-block;
            background-color: #1abc9c;
            color: #fff;
            padding: 0.5rem 1.5rem;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #16a085;
        }

        /* 页脚 */
        footer {
            background-color: #2c3e50;
            color: #bdc3c7;
            text-align: center;
            padding: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- 头部导航 -->
    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <a href="#">首页</a>
            <a href="#">关于</a>
            <a href="#">服务</a>
        </nav>
    </header>

    <!-- 网页核心内容 -->
    <main>
        <h1>欢迎来到我的纯网页</h1>
        <p>这是一个完全独立的 HTML 页面。所有的样式（CSS）都已经内置在文件的 <code>&lt;style&gt;</code> 标签中，不需要加载外部样式表，非常适合作为项目的起点或个人主页。</p>
        <p>你可以自由修改这里的文字、添加图片或调整颜色来打造你自己的专属网页。</p>
        <a href="#" class="btn" onclick="alert('你点击了按钮！')">点击体验</a>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>&copy; 2026 我的网站. 保留所有权利.</p>
    </footer>

    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

</body>
</html>
